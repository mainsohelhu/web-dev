<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login{
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 25px;
            background-color: black;
            padding: 20px;
            color: white;
            max-width: 200px;

        }
        form{
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 100%;
            
        }
        input{
            border: none;
            border-bottom: 1px solid;
            background-color: rgba(220, 220, 220, 0.223);
            padding: 5px;
            color: white;
        }
        input:focus{
            outline: none;
        }
        button{
            padding: 5px;
            color: white;
            background-color:green;
            border: none;
        }
    </style>
</head>
<body>
    <div class="login">
        <h1>Log in</h1>
        <form onsubmit="event.preventDefault(), login();">
            <label for="email">Email</label>
            <input type="email" id="email">
            <label for="password">Password</label>
            <input type="password" id="password">
            <a href="createid.html" style="color:red; text-decoration: none;">create id</a>
            <button type="submit">Login</button>
        </form>
    </div>
    <script src="users.js"></script>
    <script src="login.js"></script>
</body>
</html>
